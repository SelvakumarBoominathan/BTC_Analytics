version: 2

models:
  - name: gold_btc_ephemeral
    description: "BTC transformed data from silverlayer."
    config:
      materialized: ephemeral

  - name: gold_btc_latest_price_ephemeral
    description: "latest values taken from coingecko and loaded as seed"
    config:
      materialized: ephemeral

  - name: gold_whale_alert
    latest_version: 2
    description: "whale alert table using the ephemeral model"
    config:
      materialized: table
      contract:
        enforced: true
      latest_version_pointer:
        enabled: true
        alias: gold_whale_alert_current

    versions:
      - v: 1
        deprecation_date: 2026-10-01
        config:
          enabled: false
        columns:
          - name: OUTPUT_ADDRESS
            data_type: string
          - name: total_sent_btc
            data_type: float
          - name: TX_COUNT
            data_type: int
          - name: TOTAL_SENT_USD
            data_type: float

      - v: 2
        config:
          enabled: true
        columns:
          - name: OUTPUT_ADDRESS
            data_type: string
          - name: total_sent_btc
            data_type: float
          - name: TX_COUNT
            data_type: int

exposures:
  - name: btc_whale_alert_exposure
    label: BITCOIN WHALE ALERT
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/reporting/ba8c85cf-fd00-41de-9878-4cfba4381b47/page/MOx9F
    description: >
      BTC Whale Alert Transactions Report

    depends_on:
      - ref('gold_whale_alert', v=2)

    owner:
      name: Selvakumar Boominathan
