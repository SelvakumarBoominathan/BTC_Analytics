version: 2

models:
  - name: bronze_btc
    description: "BTC Transactional data from source."
    config:
      materialized: view

    columns:
      - name: HASY_KEY
        description: " Unique hash key for each BTC transaction"
        data_tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: "{{ source('BTC_STAGE', 'BTC_RAW')}}"
