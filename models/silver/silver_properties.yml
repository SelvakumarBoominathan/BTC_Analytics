version: 2

models:
  - name: silver_btc
    description: "BTC Transactional data from bronze layer."
    config:
      materialized: incremental
      incremental_strategy: append
      on_schema_change: append_new_columns
    columns:
      - name: HASY_KEY
        description: " Unique hash key for each BTC transaction"
        data_tests:
          - not_null
      - name: OUTPUT_ADDRESS
        description: "Test to chek the invalid BTC url formats"
        data_tests:
          - assert_valid_btc_address
