version: 2

models:
  - name: silver_btc
    description: "BTC Transactional data from bronze layer."
    config:
      materialized: incremental
      incremental_strategy: append
      on_schema_change: append_new_columns
      schema: silver
    columns:
      - name: HASY_KEY
        description: " Unique hash key for each BTC transaction"
        data_tests:
          - not_null
